    - "Barranquilla"
  segment: "midmarket"
  min_revenue_cop: "$5.000M COP"
  sectors:
    - "facility_management"
    - "real_estate"
    - "logistics"
    - "healthcare_ips"
    - "wholesale_b2b"
    - "tech_services"
  roles:
