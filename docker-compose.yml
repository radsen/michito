version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: michito-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-michito}
    ports:
      - "5432:5432"
    volumes:
      - michito_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-michito}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: michito-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: michito-worker
    restart: unless-stopped
    command: ["python", "order_worker.py", "--daemon"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env.local
    volumes:
      - ./outputs:/app/outputs

  web:
    build:
      context: .
      dockerfile: clients/web/Dockerfile
    container_name: michito-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  michito_pgdata:
    driver: local
